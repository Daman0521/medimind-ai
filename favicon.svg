<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a66ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1a66ff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mmGrad)" filter="url(#glow)"/>

  <!-- Medical Cross with softened rounded corners -->
  <path d="M26 14 h12 a2 2 0 0 1 2 2 v8 h8 a2 2 0 0 1 2 2 v12 a2 2 0 0 1 -2 2 h-8 v8 a2 2 0 0 1 -2 2 h-12 a2 2 0 0 1 -2 -2 v-8 h-8 a2 2 0 0 1 -2 -2 v-12 a2 2 0 0 1 2 -2 h8 v-8 a2 2 0 0 1 2 -2 z" fill="url(#crossGrad)"/>

  <!-- AI Spark / Node in center-right of cross -->
  <circle cx="32" cy="32" r="3.5" fill="#1a66ff"/>
  <circle cx="43" cy="21" r="2.5" fill="#ffffff" opacity="0.95"/>
  <path d="M43 16 v2 M43 24 v2 M38 21 h2 M46 21 h2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>